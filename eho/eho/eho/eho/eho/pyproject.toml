[project]
name = "hemotwin-eho"
version = "0.9.7"
description = "EcoHopfield Operator: operador neuronal evolutivo para hemorreología multiescala"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "scipy>=1.11", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
eho = "eho.__main__:main"

[tool.setuptools.packages.find]
include = ["eho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
